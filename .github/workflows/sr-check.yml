name: sr-check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          nproc
          pip install -q yt-dlp "opencv-python-headless<5" "numpy<3"
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          yt-dlp -q -f 1080 -o clip.mp4 "https://www.twitch.tv/ishowspeed/clip/CrowdedEsteemedPigeonDatBoi-GJD-l8MPsVSh4KXI"
          curl -sL -o x4v3.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
          curl -sL -o wdn.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-wdn-x4v3.pth
          ls -la *.pth
      - run: |
          cat > t.py <<'PY'
          import cv2, time, numpy as np, torch, torch.nn as nn, torch.nn.functional as F
          torch.set_num_threads(4)
          class SRVGG(nn.Module):
              def __init__(s, nf=64, nc=32, up=4):
                  super().__init__(); s.up = up
                  b = [nn.Conv2d(3, nf, 3, 1, 1), nn.PReLU(nf)]
                  for _ in range(nc): b += [nn.Conv2d(nf, nf, 3, 1, 1), nn.PReLU(nf)]
                  b += [nn.Conv2d(nf, 3 * up * up, 3, 1, 1)]
                  s.body = nn.ModuleList(b); s.ups = nn.PixelShuffle(up)
              def forward(s, x):
                  o = x
                  for l in s.body: o = l(o)
                  return s.ups(o) + F.interpolate(x, scale_factor=s.up, mode="nearest")
          def load(p):
              m = SRVGG(); sd = torch.load(p, map_location="cpu"); sd = sd.get("params", sd)
              m.load_state_dict(sd); return m.eval()
          a, b = load("x4v3.pth"), load("wdn.pth")
          # dni blend: denoise strength 0.5
          m = SRVGG(); sa, sb = a.state_dict(), b.state_dict()
          m.load_state_dict({k: 0.5 * sa[k] + 0.5 * sb[k] for k in sa}); m.eval()
          cap = cv2.VideoCapture("clip.mp4"); cap.set(cv2.CAP_PROP_POS_MSEC, 8000); ok, f = cap.read()
          H, W = f.shape[:2]; x, y, w, h = 0.0344, 0.4319, 0.1336, 0.2111
          c = f[int(y*H):int((y+h)*H), int(x*W):int((x+w)*W)]
          print("cam crop", c.shape)
          def run(model, img):
              t = torch.from_numpy(cv2.cvtColor(img, cv2.COLOR_BGR2RGB)).permute(2,0,1).float().div(255).unsqueeze(0)
              with torch.inference_mode(): o = model(t)
              return cv2.cvtColor((o.squeeze(0).permute(1,2,0).clamp(0,1).numpy()*255).round().astype(np.uint8), cv2.COLOR_RGB2BGR)
          run(m, c)
          for name, mod in (("x4v3", a), ("blend", m)):
              t0 = time.time(); u = run(mod, c); print(name, "sec/frame", round(time.time()-t0, 2))
          # batch of 8 frames
          frames = [c] * 8
          tt = torch.stack([torch.from_numpy(cv2.cvtColor(i, cv2.COLOR_BGR2RGB)).permute(2,0,1).float().div(255) for i in frames])
          t0 = time.time()
          with torch.inference_mode(): m(tt)
          print("batch8 sec/frame", round((time.time()-t0)/8, 2))
          fit = lambda i: cv2.resize(i, (1080, int(i.shape[0]*1080/i.shape[1])), interpolation=cv2.INTER_LANCZOS4)
          rows = [fit(c), fit(run(a, c)), fit(run(m, c))]
          for r, l in zip(rows, ["now (lanczos)", "AI Real-ESRGAN", "AI Real-ESRGAN + denoise"]):
              cv2.rectangle(r, (0,0), (700,60), (0,0,0), -1); cv2.putText(r, l, (15,45), cv2.FONT_HERSHEY_SIMPLEX, 1.4, (255,255,255), 3)
          cv2.imwrite("cmp.jpg", np.vstack(rows), [cv2.IMWRITE_JPEG_QUALITY, 92])
          PY
          python t.py
      - run: |
          git init -q d && cp cmp.jpg d/ && cd d && git add cmp.jpg && git -c user.name=bot -c user.email=bot@x commit -qm cmp && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/diag
