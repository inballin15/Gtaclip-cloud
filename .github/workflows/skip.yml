name: skip a clip (from the dashboard)

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  skip:
    # Only the repo owner can skip clips.
    if: startsWith(github.event.issue.title, 'skip:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cloudinary
      - name: skip it
        run: python skip_clip.py
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      - name: close the request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ job.status }}
        run: |
          msg="Done — this clip won't be posted. The dashboard updates within a few minutes."
          [ "$OK" = "success" ] || msg="Couldn't skip this one — check the Actions log."
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$msg"
      - name: refresh the dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run queue.yml --repo "$GITHUB_REPOSITORY"
