name: voice packs
# Makes each queued clip's voice pack ahead of time (voice taken out + its lines in all 20 AI voices),
# so swapping a clip's voice on the site happens on your phone in under a second.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voicepack
  cancel-in-progress: false
jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: "voice.py\nvoicepack.py\nquickedit.py\nrender_hook.py\nengage.py", sparse-checkout-cone-mode: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: voice.py }
      - name: Getting ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get -qq install -y espeak-ng >/dev/null 2>&1 || true
          pip install -q --disable-pip-version-check torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q --disable-pip-version-check "kokoro>=0.9.4" soundfile demucs faster-whisper pillow imageio-ffmpeg numpy
          git fetch -q --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          mkdir -p /tmp/site && git show origin/gh-pages:queue.json > /tmp/site/queue.json && (git show origin/gh-pages:mine.json > /tmp/site/mine.json || true)
      - name: Voice packs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON: '{"number": 0, "title": "", "body": ""}'
        run: python voicepack.py
