name: gtaclip VOD miner (best moments from live / recent broadcasts)

on:
  workflow_dispatch: {}

concurrency:
  group: vods
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: speech model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ github.run_id }}
          restore-keys: hf-
      - name: load progress
        shell: bash
        run: |
          git fetch -q origin posted:refs/remotes/origin/posted
          git worktree add -q -B posted _posted origin/posted
      - name: mine
        shell: bash
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python vod_miner.py 2>&1 | tee /tmp/vods.log; exit ${PIPESTATUS[0]}
      - name: hand the moments to the clip maker
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "gtaclip-bot"; git config --global user.email "gtaclip-bot@users.noreply.github.com"
          if ls _vodclips/*.json >/dev/null 2>&1; then
            b="vodclip-$(date -u +%Y%m%d%H%M%S)"
            export GIT_INDEX_FILE=/tmp/idx-vod; rm -f "$GIT_INDEX_FILE"
            git --work-tree=_vodclips add -A
            tree=$(git write-tree); unset GIT_INDEX_FILE
            c=$(git commit-tree "$tree" -m "$b")
            git push -q origin "$c:refs/heads/$b" && echo "pushed $b"
            gh workflow run pipeline.yml --repo "$GITHUB_REPOSITORY" --ref main || true
          fi
          cd _posted
          git add vod_progress.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "vod progress"
          for i in 1 2 3; do git push -q origin HEAD:posted && break; git fetch -q origin posted && git rebase -q -X theirs origin/posted || true; done
