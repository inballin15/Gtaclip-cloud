name: gtaclip pipeline (find clips, render videos, publish site)

on:
  schedule:
    - cron: "5,25,45 * * * *"   # every 20 min (GitHub may start a few minutes late)
  workflow_dispatch: {}
  push:
    branches: [main]
  issues:
    types: [opened]

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  run:
    # issues: only the repo owner's "skip:" / "edit:" requests
    # (pasted links / uploads and edits of YOUR clips ("... up...") are made by the separate your-clips maker: mine.yml)
    if: >-
      github.event_name != 'issues' || ((startsWith(github.event.issue.title, 'skip:') || startsWith(github.event.issue.title, 'edit:') || startsWith(github.event.issue.title, 'layout:')) && !contains(github.event.issue.title, ': up') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: cache raw clips + speech model
        uses: actions/cache@v4
        with:
          path: |
            _raw
            ~/.cache/huggingface
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: load state, posted reports and the current site
        shell: bash
        run: |
          mkdir -p _state _posted _site
          for b in state posted gh-pages; do git fetch -q --depth=1 origin "$b:refs/remotes/origin/$b" || true; done
          git show origin/state:state.json > _state/state.json 2>/dev/null || rm -f _state/state.json
          git archive origin/posted 2>/dev/null | tar -x -C _posted || true
          git archive origin/gh-pages 2>/dev/null | tar -x -C _site || true
          mkdir -p _camsrc _camhd   # AI webcam upscaling: sources waiting / upscaled strips back
          for b in camsrc camhd; do git fetch -q --depth=1 origin "$b:refs/remotes/origin/$b" 2>/dev/null && git archive "origin/$b" | tar -x -C "_$b" || true; done
      - name: pipeline
        shell: bash
        run: python pipeline.py 2>&1 | tee /tmp/pipeline.log; exit ${PIPESTATUS[0]}
        env:
          FETCH: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: publish site + save state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gtaclip-bot"; git config user.email "gtaclip-bot@users.noreply.github.com"
          # always publish the NEWEST site code (it may have changed while this run was busy)
          git fetch -q origin main || true
          for f in $(git ls-tree --name-only origin/main site/ | grep '\.html$'); do git show "origin/main:$f" > "$f" || true; done
          cp -r site/. _site/ && touch _site/.nojekyll
          b=$(git hash-object site/app.html | cut -c1-10); sed -i "s/__BUILD__/$b/" _site/*.html
          python3 -c "import json,sys;p='_site/queue.json';d=json.load(open(p));d['site_build']=sys.argv[1];json.dump(d,open(p,'w'),indent=1,ensure_ascii=False)" "$b" || true
          # quick text edits finished during this run: keep their videos on the site
          rm -rf /tmp/ed && mkdir -p /tmp/ed _site/v/e
          if git fetch -q --depth=1 origin edits:refs/remotes/origin/edits 2>/dev/null; then git archive origin/edits | tar -x -C /tmp/ed; python3 -c "import json,shutil,pathlib; ids={r['id'] for r in json.load(open('_site/queue.json')).get('ready',[])}; [shutil.copy(f,'_site/v/e/'+f.name) for f in pathlib.Path('/tmp/ed/v/e').glob('*.mp4') if f.name.rsplit('_',1)[0] in ids and not pathlib.Path('_site/v/e/'+f.name).exists()]" || true; fi
          publish () {  # dir branch  (fresh commit; unchanged videos aren't uploaded again)
            export GIT_INDEX_FILE=/tmp/idx-$2; rm -f "$GIT_INDEX_FILE"
            git --work-tree="$1" add -A
            tree=$(git write-tree); unset GIT_INDEX_FILE
            c=$(git commit-tree "$tree" -m "$2 $(date -u +%FT%TZ)")
            for i in 1 2 3 4; do git push -qf origin "$c:refs/heads/$2" && break; [ $i = 4 ] && exit 1; sleep $((i*5)); done   # GitHub sometimes rejects a push for a moment
          }
          publish_site () {  # the site: keep YOUR clips' folder (v/m + mine.json) as it is live right now - the
            for i in 1 2 3 4 5 6; do   # your-clips maker may have just added one; only push if nobody changed the site since
              git fetch -q --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages || true
              base=$(git rev-parse origin/gh-pages 2>/dev/null || echo "")
              rm -rf _site/v/m _site/mine.json _site/v/l _site/longs.json
              git archive origin/gh-pages v/m 2>/dev/null | tar -x -C _site || true
              git show origin/gh-pages:mine.json > _site/mine.json 2>/dev/null || rm -f _site/mine.json
              git archive origin/gh-pages v/l 2>/dev/null | tar -x -C _site || true   # long videos (their own maker)
              git show origin/gh-pages:longs.json > _site/longs.json 2>/dev/null || rm -f _site/longs.json
              export GIT_INDEX_FILE=/tmp/idx-gh-pages; rm -f "$GIT_INDEX_FILE"
              git --work-tree=_site add -A
              tree=$(git write-tree); unset GIT_INDEX_FILE
              c=$(git commit-tree "$tree" -m "gh-pages $(date -u +%FT%TZ)")
              git push -q --force-with-lease=gh-pages:"$base" origin "$c:refs/heads/gh-pages" && return 0
              sleep $((i*4))
            done
            return 1
          }
          publish_site
          publish _state state
          if ls _camsrc/*.mp4 >/dev/null 2>&1; then   # webcams waiting for the AI upscaler -> start it
            publish _camsrc camsrc
            gh workflow run enhance.yml -R "${{ github.repository }}" || true
          fi
      - name: save log (so Claude can read it)
        continue-on-error: true
        if: always()
        shell: bash
        run: |
          cd /tmp && rm -rf lg && mkdir lg && cd lg && git init -q
          cp /tmp/pipeline.log last_run.log 2>/dev/null || echo "no log" > last_run.log
          git config user.name "gtaclip-bot"; git config user.email "gtaclip-bot@users.noreply.github.com"
          git add last_run.log && git commit -qm "log $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:logs
