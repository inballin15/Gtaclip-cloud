name: new voice
# Swap the voice in a clip for an AI voice you picked (site: Voice button -> "voice: <clip id>" tap).
# Run it by hand with "samples" to (re)make the short sample of every voice the site plays.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      samples:
        description: "make the voice samples"
        default: "yes"
permissions:
  contents: write
  issues: write
concurrency:
  group: voice
  cancel-in-progress: false
jobs:
  voice:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.issue.title, 'voice:') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Getting your clip
        uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: "voice.py\nquickedit.py\nrender_hook.py\nfonts", sparse-checkout-cone-mode: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: voice.py }
      - name: Getting ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get -qq install -y espeak-ng >/dev/null 2>&1 || true
          pip install -q --disable-pip-version-check torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q --disable-pip-version-check "kokoro>=0.9.4" soundfile demucs faster-whisper pillow imageio-ffmpeg numpy
          git fetch -q --depth=1 origin state:refs/remotes/origin/state
          git show origin/state:state.json > /tmp/state.json
          U="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch edits "$U" /tmp/edits 2>/dev/null || { mkdir -p /tmp/edits && cd /tmp/edits && git init -q -b edits && git remote add origin "$U"; }
      - name: Voice samples
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON: '{"number": 0, "title": "", "body": ""}'
        run: python voice.py --samples
      - name: New voice
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
        run: python voice.py
      - name: Saving
        if: github.event_name == 'issues'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/qe_done ] || exit 0
          cd /tmp/edits
          git config user.name gtaclip-bot; git config user.email gtaclip-bot@users.noreply.github.com
          git add -A && git commit -qm "new voice $(cat /tmp/qe_done)" || exit 0
          ok=0; for i in 1 2 3 4 5 6; do git push -q origin HEAD:edits && { ok=1; break; }
            sleep $((i*2)); git fetch -q origin edits && git reset -q --hard origin/edits
            python3 - <<'PY'
          import json, pathlib, shutil
          e = json.loads(pathlib.Path("/tmp/qe_entry.json").read_text()); f = pathlib.Path("edits.json")
          d = json.loads(f.read_text()) if f.exists() else {}
          d[e["id"]] = e["rec"]; f.write_text(json.dumps(d, indent=1, ensure_ascii=False))
          v = e["rec"].get("video")
          if v and pathlib.Path("/tmp/qe_video.mp4").exists():
              pathlib.Path(v).parent.mkdir(parents=True, exist_ok=True); shutil.copy("/tmp/qe_video.mp4", v)
          PY
            git add -A && git commit -qm "new voice $(cat /tmp/qe_done)" || true; done
          [ $ok = 1 ] || exit 1
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "Done — the clip has the new voice."
