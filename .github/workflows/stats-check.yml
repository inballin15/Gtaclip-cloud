name: stats-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re, urllib.request, json
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36", "Accept-Language": "en-US,en;q=0.9"})
              return urllib.request.urlopen(r, timeout=20).read().decode("utf-8", "replace")
          x = get("https://www.youtube.com/feeds/videos.xml?channel_id=UCtxm_iDQ0Y7baG2mwrGGcSg")
          e = re.findall(r"<entry>(.*?)</entry>", x, re.S)
          print("YT entries", len(e))
          if e: print("YT stats:", re.findall(r"<media:(?:statistics|starRating)[^>]*>", e[0]))
          for url in ("https://www.tiktok.com/embed/@gtaclip96", "https://www.tiktok.com/@gtaclip96"):
              try:
                  p = get(url)
              except Exception as ex:
                  print(url, "ERR", ex); continue
              print(url, len(p), "playCount" in p, "diggCount" in p, "viewCount" in p)
              for k in ("playCount", "diggCount", "commentCount", "shareCount", "viewCount", "likeCount"):
                  m = re.findall(r'"%s":\s*"?(\d+)' % k, p)[:3]
                  if m: print("  ", k, m)
          vid = re.findall(r'"id":"(\d{15,22})"', get("https://www.tiktok.com/embed/@gtaclip96"))[:1]
          if vid:
              for u in (f"https://www.tiktok.com/embed/v2/{vid[0]}", f"https://www.tiktok.com/@gtaclip96/video/{vid[0]}"):
                  try:
                      p = get(u); print(u, len(p))
                      for k in ("playCount", "diggCount", "commentCount", "shareCount"):
                          m = re.findall(r'"%s":\s*"?(\d+)' % k, p)[:2]
                          if m: print("  ", k, m)
                  except Exception as ex: print(u, "ERR", ex)
          PY
