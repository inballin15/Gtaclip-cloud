name: fetch fresh GTA 6 clips

on:
  schedule:
    # every 30 minutes (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fetch_clips.py", "streamers.yaml", ".github/workflows/fetch.yml"]

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_clips.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
