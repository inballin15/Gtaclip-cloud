name: diag cam frames
# temporary: grab frames from a streamer's newest clips so Claude can find where their webcam sits
on:
  workflow_dispatch:
    inputs:
      login: { description: "twitch login", default: "nickeh30" }
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "fetch_clips.py", sparse-checkout-cone-mode: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests yt-dlp imageio-ffmpeg cloudinary pyyaml
      - env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          LOGIN: ${{ inputs.login }}
        run: |
          python - <<'PY'
          import os, subprocess, datetime as dt, imageio_ffmpeg, yt_dlp, pathlib
          import fetch_clips as F
          h = F.twitch_headers(); login = os.environ["LOGIN"]
          uid = F.helix(h, "users", login=login)["data"][0]["id"]
          start = (dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=30)).strftime("%Y-%m-%dT%H:%M:%SZ")
          clips = F.helix(h, "clips", broadcaster_id=uid, started_at=start, first=20)["data"]
          clips = sorted(clips, key=lambda c: -c["view_count"])[:4]
          out = pathlib.Path("frames"); out.mkdir()
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          for i, c in enumerate(clips):
              print(c["title"], c["view_count"], c["game_id"])
              f = out / f"c{i}.mp4"
              with yt_dlp.YoutubeDL({"outtmpl": str(f), "quiet": True, "format": "best[height<=720]/best"}) as y:
                  y.download([c["url"]])
              for t in (2, 8, 15):
                  subprocess.run([ff, "-y", "-loglevel", "error", "-ss", str(t), "-i", str(f), "-frames:v", "1", "-vf", "scale=640:-1", str(out / f"c{i}_{t}.jpg")])
              f.unlink()
          PY
      - uses: actions/upload-artifact@v4
        with: { name: frames, path: frames, retention-days: 1 }
