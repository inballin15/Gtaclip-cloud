name: dl-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp
      - run: |
          echo "OLD: $(yt-dlp -f 'bestvideo*+bestaudio/best' --print '%(format_id)s %(width)sx%(height)s fps=%(fps)s tbr=%(tbr)s' 'https://www.twitch.tv/ishowspeed/clip/CrowdedEsteemedPigeonDatBoi-GJD-l8MPsVSh4KXI')"
          echo "NEW: $(yt-dlp -f 'bestvideo*[aspect_ratio>1]+bestaudio/best[aspect_ratio>1]/best' -S res,fps,tbr --print '%(format_id)s %(width)sx%(height)s fps=%(fps)s tbr=%(tbr)s' 'https://www.twitch.tv/ishowspeed/clip/CrowdedEsteemedPigeonDatBoi-GJD-l8MPsVSh4KXI')"
          echo "PORTRAIT: $(yt-dlp -f portrait-1098 --print '%(format_id)s %(width)sx%(height)s' 'https://www.twitch.tv/ishowspeed/clip/CrowdedEsteemedPigeonDatBoi-GJD-l8MPsVSh4KXI')"
