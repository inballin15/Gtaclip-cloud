name: dl-check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp opencv-contrib-python-headless numpy imageio-ffmpeg
      - run: |
          yt-dlp -q -f 1080 -o clip.mp4 "https://www.twitch.tv/ishowspeed/clip/CrowdedEsteemedPigeonDatBoi-GJD-l8MPsVSh4KXI"
          for m in FSRCNN_x4 ESPCN_x4; do curl -sL -o $m.pb https://raw.githubusercontent.com/fannymonori/TF-ESPCN/master/export/$m.pb || true; done
          curl -sL -o FSRCNN_x4.pb https://raw.githubusercontent.com/Saafke/FSRCNN_Tensorflow/master/models/FSRCNN_x4.pb
          curl -sL -o EDSR_x4.pb https://raw.githubusercontent.com/Saafke/EDSR_Tensorflow/master/models/EDSR_x4.pb
          curl -sL -o LapSRN_x4.pb https://raw.githubusercontent.com/fannymonori/TF-LapSRN/master/export/LapSRN_x4.pb
          ls -la *.pb
      - run: |
          cat > t.py <<'PY'
          import cv2, time, numpy as np
          cap=cv2.VideoCapture('clip.mp4'); cap.set(cv2.CAP_PROP_POS_MSEC,8000); ok,f=cap.read()
          H,W=f.shape[:2]; x,y,w,h=0.0344,0.4319,0.1336,0.2111
          c=f[int(y*H):int((y+h)*H), int(x*W):int((x+w)*W)]
          out=[]; lab=[]
          def fit(i): return cv2.resize(i,(1080,int(i.shape[0]*1080/i.shape[1])),interpolation=cv2.INTER_LANCZOS4)
          out.append(fit(c)); lab.append('lanczos (now)')
          for name,algo in [('FSRCNN_x4','fsrcnn'),('ESPCN_x4','espcn'),('LapSRN_x4','lapsrn'),('EDSR_x4','edsr')]:
              try:
                  sr=cv2.dnn_superres.DnnSuperResImpl_create(); sr.readModel(name+'.pb'); sr.setModel(algo,4)
                  t=time.time(); u=sr.upsample(c); dt=time.time()-t
                  out.append(fit(u)); lab.append(f'{name} {dt*1000:.0f}ms/frame')
              except Exception as e: print(name,e)
          rows=[]
          for o,l in zip(out,lab):
              o=o.copy(); cv2.putText(o,l,(20,50),cv2.FONT_HERSHEY_SIMPLEX,1.5,(0,255,255),3); rows.append(o)
          print(lab, c.shape)
          cv2.imwrite('cmp.jpg', np.vstack(rows), [cv2.IMWRITE_JPEG_QUALITY, 90])
          PY
          python t.py
      - run: |
          git init -q d && cp cmp.jpg d/ && cd d && git add cmp.jpg && git -c user.name=bot -c user.email=bot@x commit -qm cmp && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/diag
