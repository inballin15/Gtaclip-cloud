name: quick edit
# Your text changes on a clip, in about a minute (no full re-make). The site sends a "text: <clip id>" tap.
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  edit:
    if: startsWith(github.event.issue.title, 'text:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Getting your clip
        uses: actions/checkout@v4
        with: { ref: main, sparse-checkout: "quickedit.py\nrender_hook.py\nengage.py\nfonts", sparse-checkout-cone-mode: false }
      - name: Getting ready
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q --disable-pip-version-check pillow imageio-ffmpeg &
          git fetch -q --depth=1 origin state:refs/remotes/origin/state
          git show origin/state:state.json > /tmp/state.json
          git fetch -q --depth=1 origin mine:refs/remotes/origin/mine 2>/dev/null && git show origin/mine:state.json > /tmp/mine_state.json 2>/dev/null || echo '{"clips":{}}' > /tmp/mine_state.json
          python3 -c "import json;a=json.load(open('/tmp/state.json'));b=json.load(open('/tmp/mine_state.json'));a.setdefault('clips',{}).update(b.get('clips',{}));json.dump(a,open('/tmp/state.json','w'))"   # + your clips (own maker)
          U="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch edits "$U" /tmp/edits 2>/dev/null || { mkdir -p /tmp/edits && cd /tmp/edits && git init -q -b edits && git remote add origin "$U"; }
          wait
      - name: Adding your text
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
        run: python quickedit.py
      - name: Saving
        shell: bash
        run: |
          [ -f /tmp/qe_done ] || exit 0
          cd /tmp/edits
          git config user.name gtaclip-bot; git config user.email gtaclip-bot@users.noreply.github.com
          git add -A && git commit -qm "quick edit $(cat /tmp/qe_done)" || exit 0
          ok=0; for i in 1 2 3 4 5 6; do git push -q origin HEAD:edits && { ok=1; break; }
            # another edit saved first: take theirs and add ours on top (each edit is its own clip entry)
            sleep $((i*2)); git fetch -q origin edits && git reset -q --hard origin/edits
            python3 - <<'PY'
          import json, pathlib, shutil
          e = json.loads(pathlib.Path("/tmp/qe_entry.json").read_text()); f = pathlib.Path("edits.json")
          d = json.loads(f.read_text()) if f.exists() else {}
          d[e["id"]] = e["rec"]; f.write_text(json.dumps(d, indent=1, ensure_ascii=False))
          v = e["rec"].get("video")
          if v and pathlib.Path("/tmp/qe_video.mp4").exists():
              pathlib.Path(v).parent.mkdir(parents=True, exist_ok=True); shutil.copy("/tmp/qe_video.mp4", v)
          PY
            git add -A && git commit -qm "quick edit $(cat /tmp/qe_done)" || true; done
          [ $ok = 1 ] || exit 1
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "Done — your text is on the video (no full re-make needed)."
        env:
          GH_TOKEN: ${{ github.token }}
      - name: put the new site on Cloudflare (direct)
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cfdeploy.yml -R "${{ github.repository }}" || true
