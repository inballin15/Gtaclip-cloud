name: diag (temporary - Kai black gameplay)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: |
          mkdir -p out
          python3 - <<'PY'
          import pathlib, cv2, numpy as np, pipeline
          raw = pathlib.Path("out/raw.mp4")
          pipeline.fetch_link_section("https://www.twitch.tv/videos/2936683310", 866, 866 + 22, raw, pathlib.Path("/tmp"))
          dur = pipeline.duration_of(raw)
          for i, t in enumerate([1, 5, 9, 13, 17, 21]):
              if t >= dur: break
              fr = pipeline._frames(raw, [t])[0]
              print("t", t, "brightness", round(float(fr.mean()), 1), "shape", fr.shape)
              cv2.imwrite(f"out/f{i}.jpg", cv2.resize(fr, (640, 360)))
          PY
          rm -f out/raw.mp4
      - run: |
          git config user.name diag; git config user.email diag@x
          git checkout -q --orphan diag2 && git rm -rqf --cached . && git add -f out && git commit -qm diag && git push -qf origin diag2
