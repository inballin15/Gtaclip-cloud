name: diag (temporary - VOD format pick)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          import yt_dlp, pathlib, subprocess, pipeline
          url = "https://www.twitch.tv/videos/2936518555"
          with yt_dlp.YoutubeDL({"quiet": True, "noprogress": True, "noplaylist": True,
                                 "format": "best[height<=1080][vcodec!=none]/bestvideo[height<=1080]+bestaudio/best",
                                 "format_sort": ["res", "fps", "tbr"]}) as y:
              info = y.extract_info(url, download=False)
          print("PICK", info.get("format_id"), info.get("width"), info.get("height"), "| requested", [f.get("format_id") for f in info.get("requested_formats") or []])
          print("URL", (info.get("url") or "")[:160])
          out = pathlib.Path("/tmp/t.mp4")
          pipeline.fetch_link_section(url, 16595, 16600, out, pathlib.Path("/tmp"))
          r = subprocess.run([pipeline.FF, "-i", str(out)], capture_output=True, text=True).stderr
          print("RESULT", [l.strip()[:120] for l in r.splitlines() if "Video:" in l])
          src = subprocess.run([pipeline.FF, "-ss", "16595", "-i", info["url"], "-t", "1", "-f", "null", "-"], capture_output=True, text=True).stderr
          print("STREAM", [l.strip()[:140] for l in src.splitlines() if "Stream #" in l][:6])
          PY
