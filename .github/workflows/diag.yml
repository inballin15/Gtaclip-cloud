name: diag (temporary - test new clip features)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: |
          git fetch -q --depth=1 origin state && git show origin/state:state.json > /tmp/state.json
          mkdir -p /tmp/out
          python3 - <<'PY'
          import json, pathlib, yt_dlp, cv2, numpy as np, pipeline, viral, vod_miner, time
          t0 = time.time(); r = vod_miner.chat_rate("2937465519", 18000, 18900)
          print("CHAT", None if r is None else (round(float(r.mean()), 2), round(float(r.max()), 1), int(np.argmax(r))), f"{time.time()-t0:.0f}s")
          st = json.load(open("/tmp/state.json"))["clips"]
          c = next(v | {"id": k} for k, v in st.items() if v.get("status") in ("new", "used") and "/clip/" in (v.get("twitch") or "") and v.get("cam") and v.get("streamer") in ("Lacy", "Ludwig", "Kai Cenat", "IShowSpeed"))
          out = pathlib.Path("/tmp/out"); f = out / "raw.mp4"
          with yt_dlp.YoutubeDL({"quiet": True, "outtmpl": str(f), "format": "best"}) as y: y.download([c["twitch"]])
          tmp = pathlib.Path("/tmp/t"); tmp.mkdir(exist_ok=True)
          cc = {"style": {"start": "build", "len": "s22"}}
          r = pipeline.best_part(f, "t", tmp, cc); r = pipeline.cut_dead_air(r, "t", tmp)
          ws = [w for sg in viral.transcribe(viral._audio(r)) for w in sg["words"]]
          a = viral._audio(r); secs = len(a)//16000; rms=[float(np.sqrt(np.mean(a[i*16000:(i+1)*16000]**2))) for i in range(secs)]
          pk = float(int(np.argmax(rms[1:-1]))+1)
          print("WORDS", len(ws), " ".join(w[2] for w in ws)[:200]); print("PEAK", pk, "of", secs)
          pipeline.VID = out
          pipeline.render_final(r, "test", c["cam"], c.get("hook") or "Test hook for the new features in GTA 6", tmp, subs=ws, punch_at=pk)
          v = out / "test_final.mp4"; print("SIZE", v.stat().st_size)
          cap = cv2.VideoCapture(str(v)); fr=[]
          for t in (max(0.5, pk-1.5), pk+0.6, pk+1.5, min(secs-0.5, pk+4)):
              cap.set(cv2.CAP_PROP_POS_MSEC, t*1000); ok, x = cap.read(); fr.append(cv2.resize(x, (360, 640)) if ok else np.zeros((640,360,3),np.uint8))
          cv2.imwrite(str(out / "frames.jpg"), np.hstack(fr))
          import subprocess; rr = subprocess.run([pipeline.FF, "-i", str(v), "-af", "loudnorm=print_format=summary", "-f", "null", "-"], capture_output=True, text=True)
          print("LOUD", [l for l in rr.stderr.splitlines() if "Input Integrated" in l])
          f.unlink(); v.unlink()
          PY
      - run: |
          cd /tmp/out && git init -q && git checkout -q -b diag5 && git add . && git -c user.name=diag -c user.email=d@d commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag5
