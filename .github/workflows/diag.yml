name: diag (temporary - VOD quality check)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          import subprocess, pathlib, pipeline
          tmp = pathlib.Path("/tmp/t"); tmp.mkdir(exist_ok=True)
          for v, at in [("2935059680", 3600), ("2934996320", 5000)]:
              out = tmp / f"{v}.mp4"
              pipeline.fetch_link_section(f"https://www.twitch.tv/videos/{v}", at, at + 15, out, tmp)
              r = subprocess.run([pipeline.FF, "-i", str(out)], capture_output=True, text=True).stderr
              print("RESULT", v, out.stat().st_size // 1024, "KB", [l.strip()[:140] for l in r.splitlines() if "Video:" in l or "Duration" in l])
              subprocess.run([pipeline.FF, "-y", "-loglevel", "error", "-ss", "5", "-i", str(out), "-frames:v", "1", f"/tmp/t/{v}.png"])
          PY
      - uses: actions/upload-artifact@v4
        with: { name: frames, path: /tmp/t/*.png }
