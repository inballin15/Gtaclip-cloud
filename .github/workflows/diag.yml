name: diag (temporary - before/after test of the new clip style)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          git fetch -q --depth=1 origin state && git show origin/state:state.json > /tmp/state.json
          mkdir -p /tmp/out
          python3 - <<'PY'
          import json, pathlib, yt_dlp, cv2, numpy as np, pipeline, viral
          st = json.load(open("/tmp/state.json"))["clips"]
          for k, v in st.items(): v["id"] = k
          ready = sorted([c for c in st.values() if c.get("status") in ("new", "used") and c.get("transcript")],
                         key=lambda c: c.get("found") or c.get("created") or "", reverse=True)[:10]
          items = [{"id": c["id"], "streamer": c.get("streamer", ""), "title": c.get("title", ""), "transcript": c.get("transcript", ""), "seconds": c.get("seconds")} for c in ready]
          got, status = viral.ai_score_clips(items, budget_s=90)
          print("HOOKS status", status)
          for c in ready:
              print("HOOK OLD:", c.get("hook"), "\nHOOK NEW:", (got.get(c["id"]) or {}).get("hook"))
          out = pathlib.Path("/tmp/out"); n = 0
          for c in [c for c in st.values() if c.get("twitch") and "/clip/" in c.get("twitch", "") and c.get("status") in ("new", "used")][:4]:
              f = out / f"{c['id'][:20]}.mp4"
              try:
                  with yt_dlp.YoutubeDL({"quiet": True, "outtmpl": str(f), "format": "best"}) as y: y.download([c["twitch"]])
              except Exception as e:
                  print("ERR", e); continue
              for mode in ("fast", "build"):
                  cc = {"style": {"start": mode, "len": "s22"}}
                  t = pathlib.Path(f"/tmp/t_{mode}"); t.mkdir(exist_ok=True)
                  r = pipeline.best_part(f, c["id"][:20] + mode, t, cc)
                  a = viral._audio(r); secs = len(a) // 16000
                  rms = [float(np.sqrt(np.mean(a[i*16000:(i+1)*16000]**2))+1e-9) for i in range(secs)]
                  pk = int(np.argmax(rms)) if rms else -1
                  print(f"TRIM {c['streamer']} {mode}: trim={cc.get('trim')} kept={secs}s loudest at {pk}s ({pk/max(secs,1):.0%}) | {c.get('hook')}")
              n += 1
          PY
