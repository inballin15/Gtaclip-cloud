name: diag (temporary - VOD formats)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yt-dlp
      - run: |
          for v in 2936518555 2936683310 2935059680; do echo "=== $v"; yt-dlp -F "https://www.twitch.tv/videos/$v" 2>&1 | grep -vE "^\[|^ID|^-" | head -14; done
          python3 - <<'PY'
          import yt_dlp
          for v in ("2936518555", "2936683310"):
              with yt_dlp.YoutubeDL({"quiet": True}) as y:
                  info = y.extract_info(f"https://www.twitch.tv/videos/{v}", download=False)
              print("LIVE?", v, info.get("is_live"), info.get("was_live"), info.get("live_status"))
              for f in info["formats"]:
                  print("FMT", v, f.get("format_id"), f.get("height"), f.get("fps"), f.get("tbr"), f.get("quality"), f.get("format_note"))
          PY
