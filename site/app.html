<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA Clip · Dashboard</title>
<meta name="theme-color" content="#0b0b12">
<style>
  :root { --bg:#0b0b12; --panel:#161622; --panel2:#1d1d2c; --line:#262636; --fg:#f4f4f8; --muted:#9a9ab0;
          --pink:#ff3d8b; --cyan:#29e3ff; --green:#2ee59d; --amber:#f5b544; --red:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:inherit; }
  header { position:sticky; top:0; z-index:5; background:rgba(11,11,18,.94); backdrop-filter:blur(10px); padding:10px 16px; border-bottom:1px solid var(--line); }
  .bar { display:flex; align-items:center; gap:10px; }
  .logo { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-weight:800; background:linear-gradient(135deg,var(--pink),var(--cyan)); color:#000; flex:none; }
  h1 { font-size:17px; margin:0; } h2 { font-size:16px; margin:0 0 10px; }
  .sub, .meta { color:var(--muted); font-size:12px; }
  .live { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
  .dot.warn { background:var(--amber); } .dot.bad { background:var(--red); }
  .gear { background:none; border:1px solid var(--line); color:var(--fg); border-radius:999px; padding:6px 10px; font:inherit; font-size:13px; }
  .bnav { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; background:rgba(11,11,18,.97); border-top:1px solid var(--line); padding:6px 6px calc(6px + env(safe-area-inset-bottom)); backdrop-filter:blur(10px); }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border:0; border-radius:12px; background:transparent; color:var(--muted); font:inherit; font-size:12px; font-weight:600; }
  .tab .ic { font-size:18px; line-height:1; }
  .tab b { position:absolute; margin:-4px 0 0 34px; background:var(--pink); color:#000; border-radius:999px; font-size:10px; padding:1px 5px; }
  .tab b:empty { display:none; }
  .tab[aria-selected="true"] { color:var(--fg); background:#ffffff12; }
  .hrow { display:flex; align-items:center; margin-bottom:8px; } .hrow h2 { margin:0; }
  .link { margin-left:auto; background:none; border:0; color:var(--cyan); font:inherit; font-size:13px; font-weight:600; }
  .strip { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .strip a { flex:none; text-decoration:none; background:var(--panel2); border-radius:12px; padding:8px 10px; min-width:110px; }
  .strip .nm { font-weight:700; font-size:14px; } .strip .v { color:var(--muted); font-size:12px; }
  .upbtn { width:100%; background:var(--panel); color:var(--fg); border:1px dashed #ffffff40; margin-bottom:10px; font-size:15px; padding:12px; }
  .bar2 { height:10px; border-radius:6px; background:var(--panel2); overflow:hidden; } .bar2 > div { height:100%; background:linear-gradient(90deg,var(--pink),var(--cyan)); width:0; transition:width .3s; }
  .upitem { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 12px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chip { border:1px solid var(--line); background:var(--panel); color:var(--fg); font:inherit; font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; }
  .chip.warn { border-color:#f5b54466; color:var(--amber); } .chip.bad { border-color:#ff6b6b66; color:#ff9a9a; }
  .chip::before { content:"●"; margin-right:5px; font-size:9px; vertical-align:2px; }
  .viral { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:12px; background:var(--panel2); font-size:13px; }
  .viral b { font-size:20px; min-width:30px; } .viral span { font-weight:800; } .viral em { color:var(--muted); font-style:normal; font-size:12px; }
  .viral.post b, .viral.post span { color:var(--green); } .viral.maybe b, .viral.maybe span { color:var(--amber); } .viral.skip b, .viral.skip span { color:var(--red); }
  .sysline { width:100%; text-align:left; font:inherit; color:inherit; display:flex; align-items:center; gap:10px; padding:12px 14px; }
  .sysline .t { font-weight:700; } .sysline .m { color:var(--muted); font-size:12px; margin-left:auto; text-align:right; }
  .pulse { width:10px; height:10px; border-radius:50%; background:var(--muted); flex:none; }
  .pulse.run { background:var(--cyan); box-shadow:0 0 0 0 #29e3ff88; animation:pl 1.6s infinite; } .pulse.ok { background:var(--green); } .pulse.bad { background:var(--red); } .pulse.wait { background:var(--amber); }
  @keyframes pl { 0% { box-shadow:0 0 0 0 #29e3ff88; } 70% { box-shadow:0 0 0 10px #29e3ff00; } 100% { box-shadow:0 0 0 0 #29e3ff00; } }
  .sysrow { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); } .sysrow:last-child { border:0; }
  .sysrow .pulse { margin-top:5px; } .sysrow b { display:block; } .sysrow .meta { margin-top:2px; }
  .btns.more { display:none; } .btns.more.open { display:flex; }
  .wrap { padding:12px 12px calc(84px + env(safe-area-inset-bottom)); max-width:1200px; margin:0 auto; }
  section[hidden], [hidden] { display:none !important; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:14px; margin-bottom:14px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
  .kpi { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:12px 14px; }
  .kpi .l { color:var(--muted); font-size:12px; } .kpi .n { font-size:26px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; } .kpi .s { color:var(--muted); font-size:12px; }
  .run { display:flex; flex-direction:column; gap:10px; }
  .run .state { font-size:20px; font-weight:800; }
  .run.on { background:linear-gradient(135deg,#2ee59d22,var(--panel) 70%); border-color:#2ee59d55; }
  .run.off { background:linear-gradient(135deg,#ff6b6b1a,var(--panel) 70%); border-color:#ff6b6b44; }
  .bigbtn { padding:14px; border-radius:16px; border:0; font:inherit; font-size:17px; font-weight:800; }
  .bigbtn.start { background:var(--green); color:#000; } .bigbtn.stop { background:var(--red); color:#000; }
  .bigbtn:disabled { opacity:.6; }
  .note { font-size:13px; padding:9px 11px; border-radius:12px; background:#29e3ff14; border:1px solid #29e3ff40; }
  .note.warn { background:#f5b5441a; border-color:#f5b54466; } .note.bad { background:#ff6b6b1a; border-color:#ff6b6b66; } .note.good { background:#2ee59d1a; border-color:#2ee59d66; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; }
  .card.now { border-color:var(--pink); box-shadow:0 0 0 1px var(--pink); }
  .vwrap { background:#000; aspect-ratio:9/16; max-height:62vh; width:100%; position:relative; }
  .vwrap video { width:100%; height:100%; display:block; object-fit:contain; background:#000; }
  .body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .pill { padding:4px 10px; border-radius:999px; background:#ffffff14; font-size:12px; font-weight:600; }
  .pill.paid { background:var(--pink); color:#000; }
  .status { padding:5px 10px; border-radius:999px; font-size:12px; font-weight:700; display:inline-flex; gap:6px; align-items:center; }
  .s-wait { background:#ffffff14; color:var(--muted); } .s-next { background:#29e3ff26; color:var(--cyan); }
  .s-busy { background:#f5b54426; color:var(--amber); } .s-live { background:#2ee59d26; color:var(--green); } .s-err { background:#ff6b6b26; color:var(--red); }
  .spin { width:10px; height:10px; border-radius:50%; border:2px solid currentColor; border-right-color:transparent; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .title { font-size:16px; font-weight:650; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--fg); font:inherit; font-size:13px; text-decoration:none; display:inline-block; cursor:pointer; }
  .btn.pink { background:var(--pink); color:#000; border-color:var(--pink); font-weight:700; }
  .btn.cyan { background:var(--cyan); color:#000; border-color:var(--cyan); font-weight:600; }
  .btn.del { border-color:#ff6b6b66; color:#ff9a9a; }
  .btn:disabled { opacity:.5; }
  .edit { display:flex; flex-direction:column; gap:8px; padding:10px; border-radius:14px; background:var(--panel2); }
  .edit label { font-size:12px; color:var(--muted); }
  .edit input, .edit textarea, .setin { width:100%; font:inherit; font-size:16px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 10px; }
  .edit textarea { min-height:110px; resize:vertical; }
  .plist { display:flex; flex-direction:column; gap:10px; }
  .prow { background:var(--panel2); border-radius:16px; padding:12px; display:flex; gap:12px; }
  .prow img { width:64px; height:114px; object-fit:cover; border-radius:10px; background:#000; flex:none; }
  .prow .info { display:flex; flex-direction:column; gap:7px; min-width:0; flex:1; }
  .plat { display:grid; grid-template-columns:auto 1fr; gap:4px 8px; align-items:center; font-size:13px; }
  .nums { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .nums b { color:var(--fg); }
  details > summary { cursor:pointer; list-style:none; font-weight:700; display:flex; align-items:center; gap:8px; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:"▾"; margin-left:auto; color:var(--muted); }
  details[open] > summary::after { content:"▴"; }
  .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:12px; }
  .slot { border-radius:14px; padding:9px 10px; background:var(--panel2); border:1px solid transparent; font-size:12px; }
  .slot .t { font-weight:700; font-size:14px; } .slot .w { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .slot.done { background:#2ee59d1f; } .slot.next { border-color:var(--cyan); } .slot.past { opacity:.45; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; } td.n, th.n { text-align:right; }
  .barrow { display:grid; grid-template-columns:90px 1fr 70px; gap:8px; align-items:center; font-size:13px; margin:6px 0; }
  .barbg { height:10px; border-radius:6px; background:var(--panel2); overflow:hidden; } .barfg { height:100%; background:linear-gradient(90deg,var(--pink),var(--cyan)); }
  .empty { text-align:center; color:var(--muted); padding:28px 10px; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:999px; font-weight:600; font-size:14px; z-index:30; max-width:92vw; }
  .sheet { position:fixed; inset:0; background:#000a; z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet .in { background:var(--panel); width:100%; max-width:560px; max-height:88vh; overflow:auto; border-radius:22px 22px 0 0; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .sheet .head { display:flex; align-items:center; } .sheet .head .btn { margin-left:auto; }
  .steps { white-space:pre-line; font-size:14px; }
  .scroll { overflow-x:auto; }
  .lrow { display:flex; gap:10px; align-items:center; text-decoration:none; background:var(--panel2); border-radius:14px; padding:8px; }
  .lrow img { width:96px; height:54px; object-fit:cover; border-radius:8px; background:#000; flex:none; }
  .lrow .nm { font-weight:700; } .lrow .t { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .redpill { background:var(--red); color:#000; padding:2px 7px; border-radius:999px; font-size:11px; font-weight:800; }
  .fstat { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-bottom:8px; }
  .fstat div { background:var(--panel2); border-radius:12px; padding:8px 10px; } .fstat b { display:block; font-size:20px; }
  .seg { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px; margin-bottom:8px; }
  .seg button { flex:1; border:0; background:transparent; color:var(--fg); font:inherit; font-weight:700; padding:9px; border-radius:999px; }
  .seg button[aria-pressed="true"] { background:var(--cyan); color:#000; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">GC</div>
    <div><h1>GTA Clip</h1><div class="sub" id="livetxt">loading…</div></div>
    <span class="dot" id="dot" style="margin-left:auto"></span>
    <button class="gear" id="reboot" aria-label="Get newest version" title="Get newest version">↻</button>
    <button class="gear" id="gear" aria-label="Settings">⚙︎</button>
  </div>
</header>
<main class="wrap">
  <section id="tab-home">
    <div id="setup"></div>
    <div class="box run" id="run"></div>
    <div id="nowbox"></div>
    <button class="box sysline" id="sysline" data-go="stats"></button>
    <div class="box"><div class="hrow"><h2>Live now</h2><button class="link" data-go="stats">See all</button></div><div class="strip" id="livestrip"></div></div>
    <div id="submitcard"></div>
    <details class="box" id="slots-box"><summary id="slots-sum">Today's slots</summary><div class="slots" id="slots"></div></details>
  </section>
  <section id="tab-queue" hidden>
    <button class="bigbtn upbtn" id="upbtn">＋ Make clips (upload or link)</button>
    <div id="uploads"></div>
    <div class="seg" id="variant">
      <button data-v="final">With caption</button><button data-v="clean">No caption</button>
    </div>
    <div class="meta" id="queuemeta" style="margin:0 2px 10px"></div>
    <div class="grid" id="queuelist"></div>
  </section>
  <section id="tab-posted" hidden>
    <div id="submitwrap"></div>
    <div class="plist" id="postedlist"></div>
  </section>
  <section id="tab-stats" hidden>
    <div class="box"><h2>System status</h2><div id="sysbox"></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="box"><h2>Clip finder</h2><div id="finder"></div></div>
    <div class="box"><h2>Live now</h2><div class="meta" id="livemeta" style="margin-bottom:8px"></div><div class="plist" id="liveboard"></div></div>
    <div id="statsbox"></div>
  </section>
</main>
<nav class="bnav" role="tablist">
  <button class="tab" data-tab="home" aria-selected="true"><span class="ic">⌂</span>Home</button>
  <button class="tab" data-tab="queue" aria-selected="false"><span class="ic">▶</span>Queue <b id="qcount"></b></button>
  <button class="tab" data-tab="posted" aria-selected="false"><span class="ic">✓</span>Posted <b id="pcount"></b></button>
  <button class="tab" data-tab="stats" aria-selected="false"><span class="ic">▤</span>Stats</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="in" id="sheet-in"></div></div>
<script>
const BUILD = '__BUILD__';
const DEV = !/^[0-9a-f]{10}$/.test(BUILD);   // true only when not published
const REPO = 'inballin15/Gtaclip-cloud';
const SLOTS = [[7, 7], [8, 37], [10, 7], [11, 37], [13, 7], [14, 37], [16, 7], [17, 37], [19, 7], [20, 37], [22, 7]];
const PAGES = 'https://inballin15.github.io/Gtaclip-cloud/';
const CR = { Clix: 'https://contentrewards.com/discover/7a6a234b-1e9e-4da3-a600-54cc3142e710',
             Lacy: 'https://contentrewards.com/c/campaigns/4479e5e2-9a00-489e-8b0c-345834f37cc7?group=1',
             Kai: 'https://contentrewards.com/',          // TODO: exact campaign link
             YourRAGE: 'https://contentrewards.com/' };   // TODO: exact campaign link
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } } };
const ghKey = () => ls.get('gc-gh2', '') || (() => { try { return localStorage.getItem('gc-gh') || ''; } catch (e) { return ''; } })();
const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n || 0);
const tET = (iso) => new Date(iso).toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
const dET = (iso) => new Date(iso).toLocaleString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const ago = (iso) => { const s = Math.max(0, (Date.now() - new Date(iso)) / 1000); return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
function toast(msg) { const t = el('div', 'toast', msg); document.body.append(t); setTimeout(() => t.remove(), 2600); }
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = el('textarea'); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(`${what} copied`);
}

// ------------------------------------------------------------ state
let Q = { ready: [], posted: [] };     // queue.json  (rebuilt by the render pipeline)
let L = null;                          // live.json   (written by the poster every few minutes / right after a tap)
let openIssues = [];                   // your taps GitHub hasn't finished yet
let pend = ls.get('gc-pending', {});   // taps made on this phone: {key: {at, title}}
let submitted = ls.get('gc-submitted', {});
let tab = 'home';
const savePend = () => ls.set('gc-pending', pend);

async function ghTap(title, body = '') {
  const key = ghKey();
  if (!key) { openSettings('Connect GitHub once so buttons work with one tap.'); return false; }
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues`, { method: 'POST',
      headers: { Authorization: `Bearer ${key}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body }) });
    if (r.status === 401) { openSettings('Your GitHub key expired or is wrong. Make a new one below.'); return false; }
    if (r.status === 403 || r.status === 404) { openSettings('Your GitHub key needs "Issues: Read and write" on Gtaclip-cloud.'); return false; }
    if (!r.ok) { toast(`GitHub error ${r.status} — try again`); return false; }
    pend[title] = { at: Date.now(), title }; savePend();
    setTimeout(refreshLive, 4000); setTimeout(refreshLive, 15000);
    return true;
  } catch (e) { toast('No connection — try again'); return false; }
}

async function getJSON(url, headers) {
  const r = await fetch(url, { cache: 'no-store', headers }); if (!r.ok) throw new Error(r.status); return r.json();
}
async function refreshQueue() {
  try {
    Q = await getJSON(PAGES + 'queue.json?t=' + Date.now());
    if (Q.site_build && !DEV && Q.site_build !== BUILD && !sessionStorage.getItem('rl-' + Q.site_build)) {
      sessionStorage.setItem('rl-' + Q.site_build, '1'); location.reload(); return;
    }
  } catch (e) { /* keep last */ }
}
async function refreshLive() {
  const key = ghKey();
  try {
    if (key) {
      L = await getJSON(`https://api.github.com/repos/${REPO}/contents/live.json?ref=posted&t=${Date.now()}`,
        { Authorization: `Bearer ${key}`, Accept: 'application/vnd.github.raw+json' });
      const iss = await getJSON(`https://api.github.com/repos/${REPO}/issues?state=open&per_page=50&t=${Date.now()}`,
        { Authorization: `Bearer ${key}`, Accept: 'application/vnd.github+json' });
      openIssues = iss.filter((i) => !i.pull_request).map((i) => i.title);
    } else {
      L = await getJSON(`https://raw.githubusercontent.com/${REPO}/posted/live.json?t=${Date.now()}`);
    }
  } catch (e) {
    try { L = await getJSON(`https://raw.githubusercontent.com/${REPO}/posted/live.json?t=${Date.now()}`); } catch (e2) { /* keep last */ }
  }
  // a tap is done when GitHub closed it, or it's old
  for (const [k, p] of Object.entries(pend)) {
    const stillOpen = openIssues.includes(k);
    const age = Date.now() - p.at;
    if ((!stillOpen && age > 20000 && key) || age > 15 * 60000) delete pend[k];
  }
  savePend();
  render();
}

// ------------------------------------------------------------ derived data
const posts = () => (L && L.posts) || {};
const isPending = (prefix) => Object.keys(pend).some((k) => k.startsWith(prefix)) || openIssues.some((t) => t.startsWith(prefix));
function queueList() {
  const P = posts(); const blocked = new Set((L && L.blocked) || []);

  const tapped = (r) => now.has(r.id) || isPending('post: ' + r.id);

  const have = new Set(out.map((p) => norm(p.hook)));
  for (const p of Q.posted || []) if (!have.has(norm(p.hook))) out.push({ hook: p.hook, streamer: p.streamer, campaign: p.campaign, posted_at: p.posted, tiktok: p.tiktok, youtube: p.youtube });

    ls.set('gc-gh2', k); toast('Connected ✓'); $('sheet').hidden = true; refreshLive();
  };
  const rm = el('button', 'btn', 'Disconnect'); rm.onclick = () => { ls.set('gc-gh2', ''); try { localStorage.removeItem('gc-gh'); } catch (e) { /* */ } openSettings(); };
  const row = el('div', 'btns'); row.append(sv); if (ghKey()) row.append(rm); nodes.push(inp, row);
  const bh = el('button', 'btn', 'Buffer connection help'); bh.onclick = openBufferHelp; nodes.push(el('hr'), bh);
  sheet('Settings', nodes);
}
function openBufferHelp() {
  const ok = L && L.buffer_ok;
  sheet('Connect Buffer (one time)', [
    el('div', 'note ' + (ok ? 'good' : 'warn'), ok ? 'Buffer is connected ✓ — posts go out automatically.' : 'GitHub posts straight to Buffer. It needs your Buffer API key saved as a GitHub secret.'),
    el('div', 'steps', ['1. Tap "Open Buffer API page" and sign in.', '2. Personal Access → + New Key (name it gtaclip). Copy the key.',
      '3. Tap "Open GitHub secrets" → New repository secret.', '4. Name: BUFFER_API_KEY  ·  Secret: paste the key → Add secret.',
      '5. Come back here — within 5 minutes this shows "Buffer is connected".', 'Never paste the key in a chat.'].join('\n')),
    Object.assign(el('a', 'btn cyan', 'Open Buffer API page'), { href: 'https://publish.buffer.com/settings/api', target: '_blank' }),
    Object.assign(el('a', 'btn cyan', 'Open GitHub secrets'), { href: `https://github.com/${REPO}/settings/secrets/actions/new`, target: '_blank' }),
  ]);
}

// ------------------------------------------------------------ boot
function switchTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', x.dataset.tab === t));
  for (const s of ['home', 'queue', 'posted', 'stats']) $('tab-' + s).hidden = s !== tab;
  render(); window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach((b) => b.onclick = () => switchTab(b.dataset.tab));
document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => switchTab(b.dataset.go));
$('gear').onclick = () => openSettings();
async function rebootSite() {
  toast('Getting the newest version…');
  try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch (e) { /* */ }
  try { if (navigator.serviceWorker) for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) { /* */ }
  try { sessionStorage.clear(); } catch (e) { /* */ }
  try { await fetch(location.pathname + '?v=' + Date.now(), { cache: 'reload' }); } catch (e) { /* */ }
  try { sessionStorage.setItem('gc-rebooted', '1'); } catch (e) { /* */ }
  location.replace(location.pathname + '?v=' + Date.now());
}
$('reboot').onclick = rebootSite;
$('upbtn').onclick = openUpload;
setInterval(checkUploads, 30000);
refreshRuns(); setInterval(refreshRuns, 20000);
document.querySelectorAll('#variant button').forEach((b) => b.onclick = () => { variant = b.dataset.v; ls.set('gc-variant', variant); renderQueue(); });
$('sheet').onclick = (e) => { if (e.target.id === 'sheet') $('sheet').hidden = true; };
(async () => {
  await Promise.all([refreshQueue(), refreshLive()]);
  try { if (sessionStorage.getItem('gc-rebooted')) { sessionStorage.removeItem('gc-rebooted'); toast(Q.site_build === BUILD || DEV ? 'You have the newest version ✓' : 'Newest version is still publishing — try again in a minute'); } } catch (e) { /* */ }
  render();
  setInterval(refreshQueue, 45000);
  setInterval(() => { const busy = Object.keys(pend).length > 0; if (busy || Date.now() % 30000 < 10000) refreshLive(); }, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refreshQueue(); refreshLive(); } });
})();
</script>
