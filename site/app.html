<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clip HQ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08080d">
<style>
:root{--bg:#08080d;--p1:#13131c;--p2:#1b1b27;--p3:#242434;--line:#ffffff12;--fg:#f5f5fa;--mut:#9898ad;--pink:#ff3d8b;--cyan:#29e3ff;--green:#2ee59d;--amber:#f5b544;--red:#ff6b6b;
  --r:18px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
/* header */
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(var(--bg) 70%,#08080d00);display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:13px;background:linear-gradient(135deg,var(--pink),var(--cyan));color:#000;flex:none}
header h1{font-size:18px;margin:0;letter-spacing:-.2px}
header .sub{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}.dot.warn{background:var(--amber)}.dot.bad{background:var(--red)}
.icbtn{margin-left:auto;display:flex;gap:6px}
.icbtn button{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--p1);font-size:16px;display:grid;place-items:center;transition:transform .15s var(--ease)}
.icbtn button:active{transform:scale(.9)}
/* layout */
main{padding:4px 14px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.view{animation:fadein .28s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.pop{animation:pop .3s var(--ease)}
h2{font-size:15px;margin:0 0 10px;letter-spacing:-.1px}
.hrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}.hrow h2{margin:0}
.lnk{margin-left:auto;background:none;border:0;color:var(--cyan);font-size:13px;font-weight:600;padding:4px}
.mut{color:var(--mut);font-size:12px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{padding:3px 9px;border-radius:999px;background:#ffffff12;font-size:12px;font-weight:600;white-space:nowrap}
.pill.paid{background:var(--pink);color:#000}
.pill.tt{background:#ffffff;color:#000}.pill.yt{background:#ff3b3b;color:#fff}
/* buttons */
.btn{border:1px solid var(--line);background:var(--p2);border-radius:12px;padding:9px 13px;font-size:13px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:transform .12s var(--ease),opacity .2s}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.5}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#000}.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#000}
.btn.ghost{background:transparent}.btn.del{color:#ff9a9a;border-color:#ff6b6b55;background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.big{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;transition:transform .12s var(--ease)}
.big:active{transform:scale(.98)}.big.go{background:var(--green);color:#000}.big.stop{background:var(--red);color:#000}.big.alt{background:var(--p2);border:1px dashed #ffffff35}
.big:disabled{opacity:.6}
/* status hero */
.hero{border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.hero.on{background:radial-gradient(120% 140% at 0% 0%,#2ee59d30,var(--p1) 60%)}
.hero.off{background:radial-gradient(120% 140% at 0% 0%,#ff6b6b26,var(--p1) 60%)}
.hero .st{font-size:21px;font-weight:850;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.hero .st .pulse{width:10px;height:10px}
.hero .why{color:var(--mut);font-size:13px;margin:4px 0 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--p1);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.chip.warn{color:var(--amber)}.chip.warn::before{background:var(--amber)}.chip.bad{color:#ff9a9a}.chip.bad::before{background:var(--red)}.chip.good{color:var(--green)}.chip.good::before{background:var(--green)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.pulse.run{background:var(--cyan);animation:pl 1.6s infinite}.pulse.ok{background:var(--green)}.pulse.bad{background:var(--red)}.pulse.wait{background:var(--amber)}
@keyframes pl{0%{box-shadow:0 0 0 0 #29e3ff99}70%{box-shadow:0 0 0 9px #29e3ff00}100%{box-shadow:0 0 0 0 #29e3ff00}}
.sysline{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--p1);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.sysline b{font-size:14px}.sysline .mut{margin-left:auto;text-align:right}
/* next-up rail */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -14px;padding:0 14px 2px}
.mini{flex:none;width:118px;scroll-snap-align:start;border:0;padding:0;background:none;text-align:left}
.mini .th{width:118px;aspect-ratio:9/16;border-radius:14px;background:var(--p2) center/cover;position:relative;overflow:hidden}
.mini .th span{position:absolute;left:6px;top:6px;font-size:11px;font-weight:800;background:#000b;padding:2px 6px;border-radius:8px}
.mini .h{font-size:12px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.live{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.live a{flex:none;text-decoration:none;background:var(--p2);border-radius:14px;padding:9px 11px;min-width:120px}
.live b{font-size:14px;display:flex;align-items:center;gap:5px}.live b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red)}
/* queue */
.seg{display:flex;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:10px;position:relative}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mut);transition:color .2s,background .25s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--p3);color:var(--fg)}
.clip{background:var(--p1);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:14px;animation:pop .3s var(--ease) both}
.clip.now{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.vbox{position:relative;aspect-ratio:9/16;max-height:70vh;margin:0 auto;background:#000 center/contain no-repeat;cursor:pointer}
.vbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.play{position:absolute;inset:0;display:grid;place-items:center;border:0;background:linear-gradient(#0000 60%,#000a)}
.play i{width:62px;height:62px;border-radius:50%;background:#fffffff0;display:grid;place-items:center;font-style:normal;color:#000;font-size:22px;padding-left:4px;box-shadow:0 8px 30px #0008;transition:transform .15s var(--ease)}
.play:active i{transform:scale(.9)}
.vtop{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.vtop .pill{background:#000c;backdrop-filter:blur(6px)}
.score{position:absolute;right:10px;bottom:10px;border-radius:14px;padding:6px 10px;background:#000c;backdrop-filter:blur(6px);font-weight:900;font-size:18px;pointer-events:none}
.score small{display:block;font-size:10px;font-weight:700;opacity:.85}
.score.post{color:var(--green)}.score.maybe{color:var(--amber)}.score.skip{color:var(--red)}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:9px}
.hook{font-size:16px;font-weight:700;letter-spacing:-.2px}
.status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.s-wait{background:#ffffff10;color:var(--mut)}.s-next{background:#29e3ff22;color:var(--cyan)}.s-busy{background:#f5b54422;color:var(--amber)}.s-live{background:#2ee59d22;color:var(--green)}.s-err{background:#ff6b6b22;color:var(--red)}
.spin{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s var(--ease)}
.more.open{grid-template-rows:1fr}.more>div{overflow:hidden}
.more .btns{padding-top:2px}
.why{font-size:12px;color:var(--mut)}
.upitem{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:6px;background:var(--p3);overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));transition:width .4s var(--ease)}
.empty{text-align:center;color:var(--mut);padding:34px 12px}
/* posted */
.vrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.vrow:last-child{border:0}
.vrow .t{flex:1;min-width:0}.vrow .t div:first-child{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:800;font-size:16px;min-width:56px}.num small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.sub-card{background:linear-gradient(135deg,#ff3d8b22,var(--p1) 70%);border-color:#ff3d8b55}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:12px 14px;animation:pop .3s var(--ease) both}
.kpi .l{color:var(--mut);font-size:12px}.kpi .n{font-size:26px;font-weight:850;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.kpi .s{color:var(--mut);font-size:11px}
.big.tt{background:#25f4ee;color:#000;margin-top:8px}.big.yt{background:#ff3b3b;color:#fff;margin-top:8px}.big.go+.big{margin-top:8px}
.tog{margin-left:auto;border:1px solid #ffffff25;background:var(--p2);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;min-height:32px}
.tog.on{background:var(--green);color:#000;border-color:transparent}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lane{background:var(--p2);border-radius:14px;padding:10px;min-width:0;border-top:3px solid #25f4ee}.lane.yt{border-top-color:#ff3b3b}
.lane .lh{font-weight:800;font-size:15px}.lane .row{margin-top:8px;flex-wrap:wrap}.lane .row .mut{font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lnext{display:flex;gap:8px;align-items:center;background:none;border:0;color:inherit;text-align:left;padding:0;margin-top:8px;width:100%}
.lnext .th{flex:0 0 40px;height:70px;border-radius:8px;background:#000 center/cover}.lnext .h{font-size:12.5px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.budget{margin-top:10px}.budget .bbg{height:6px}.budget .mut{font-size:12px;margin-top:4px}
.stylerow{display:flex;align-items:center;gap:10px;margin:6px 0}.stylerow b{flex:0 0 92px;font-size:13px}.chips2{display:flex;flex-wrap:wrap;gap:6px}
.lessons{margin:6px 0 4px;padding:0;list-style:none}.lessons li{padding:6px 10px;border-radius:10px;margin:4px 0;font-size:13.5px;background:#2ecc7122}.lessons li.bad{background:#ff3b3b22}
.card .sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:12px 0 4px}
.pill.up{background:#2ecc7133;color:#7dffb0}.pill.down{background:#ff3b3b33;color:#ff9a9a}
@media (max-width:360px){.lanes{grid-template-columns:1fr}}
.brow{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.bbg{height:9px;border-radius:6px;background:var(--p3);overflow:hidden}.bfg{height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));width:0;transition:width .7s var(--ease)}
.sys{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.sys:last-child{border:0}.sys .pulse{margin-top:5px}.sys b{display:block;font-size:14px}
.lrow{display:flex;gap:10px;align-items:center;text-decoration:none;padding:8px 0}.lrow img{width:92px;height:52px;border-radius:9px;object-fit:cover;background:#000;flex:none}
.fstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.fstat div{background:var(--p2);border-radius:12px;padding:8px}.fstat b{display:block;font-size:19px}
/* nav */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;max-width:520px;margin:0 auto;display:flex;background:#16161fe8;backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:22px;padding:5px;box-shadow:0 10px 40px #000a}
nav .ind{position:absolute;top:5px;bottom:5px;left:5px;border-radius:17px;background:#ffffff14;transition:transform .35s var(--ease),width .35s var(--ease)}
nav button{flex:1;position:relative;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut);transition:color .2s}
nav button .i{font-size:18px;line-height:1.1}
nav button[aria-selected="true"]{color:var(--fg)}
nav button b{position:absolute;top:2px;left:calc(50% + 8px);background:var(--pink);color:#000;border-radius:999px;font-size:10px;padding:0 5px;min-width:16px;text-align:center}
nav button b:empty{display:none}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:#0000;transition:background .3s;pointer-events:none}
.sheet.open{background:#000a;pointer-events:auto}
.sheet .in{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--p1);border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .35s var(--ease);display:flex;flex-direction:column;gap:11px;overscroll-behavior:contain}
.sheet.open .in{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#ffffff30;margin:2px auto 4px;flex:none}
.shead{display:flex;align-items:center;gap:8px}.shead h2{margin:0;font-size:17px}.shead .btn{margin-left:auto}
.note{font-size:13px;padding:10px 12px;border-radius:14px;background:#29e3ff12;border:1px solid #29e3ff35}
.note.warn{background:#f5b54418;border-color:#f5b54455}.note.bad{background:#ff6b6b18;border-color:#ff6b6b55}.note.good{background:#2ee59d18;border-color:#2ee59d55}
.in input,.in select,.in textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.in textarea{min-height:100px;resize:vertical}
.in label{font-size:12px;color:var(--mut);margin-bottom:-6px}
.steps{white-space:pre-line;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:92vw;transition:all .3s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* editor */
.ed{display:grid;grid-template-columns:1fr;gap:12px}
.edprev{display:flex;justify-content:center}
.edprev canvas{width:236px;height:420px;border-radius:16px;background:#000;box-shadow:0 8px 30px #0009;touch-action:none;cursor:grab}
.src{position:relative;border-radius:12px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.src img{width:100%;display:block;pointer-events:none}
.camb{position:absolute;border:2px solid var(--cyan);box-shadow:0 0 0 9999px #0007;border-radius:4px;touch-action:none}
.camb .hd{position:absolute;right:-11px;bottom:-11px;width:24px;height:24px;border-radius:50%;background:var(--cyan);border:3px solid #000}
.slider{display:flex;align-items:center;gap:10px;font-size:13px}.slider span{width:92px;color:var(--mut)}.slider input{flex:1;padding:0;accent-color:var(--cyan)}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(135deg,#29e3ff1c,var(--p1) 70%);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.topic .k{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.6px}.topic b{font-size:18px;letter-spacing:-.2px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tg{border:0;background:var(--p2);border-radius:12px;padding:0 0 6px;overflow:hidden;text-align:center;font-size:11px;font-weight:600;transition:transform .12s}
.tg:active{transform:scale(.95)}.tg img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;margin-bottom:4px;background:var(--p3)}
.tg.on{outline:2px solid var(--cyan)}
.edx{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;opacity:0;transform:scale(.98);transition:opacity .25s var(--ease),transform .25s var(--ease);padding-top:env(safe-area-inset-top)}
.edx.in{opacity:1;transform:none}.edx.out{opacity:0;transform:scale(.98)}
.edx-top{display:flex;align-items:center;gap:6px;padding:8px 10px}
.edx-ic{width:40px;height:40px;border-radius:50%;border:0;background:#ffffff14;color:#fff;font-size:18px;display:grid;place-items:center}.edx-ic:disabled{opacity:.3}
.edx-sp{flex:1}.edx-save{border:0;background:var(--pink);color:#000;font-weight:800;padding:10px 20px;border-radius:999px;font-size:15px}.edx-save:disabled{opacity:.6}
.edx-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.edx-stage canvas{border-radius:14px;touch-action:none;background:#111}
.edx-vid{max-height:100%;max-width:100%;border-radius:14px;background:#111}
.edx-panel{padding:10px 14px 4px;display:flex;flex-direction:column;gap:10px;max-height:38vh;overflow:auto;background:#0d0d14;border-top:1px solid var(--line)}
.edx-panel:empty{display:none}
.edx-panel textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px}
.edx-panel summary{font-size:13px;color:var(--mut);cursor:pointer}
.edx-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.edx-chip{flex:none;border:1px solid var(--line);background:var(--p2);color:var(--fg);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;transition:transform .12s}
.edx-chip:active{transform:scale(.95)}.edx-chip.on{background:#fff;color:#000}
.edx-tools{display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#0d0d14}
.edx-tool{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:4px 8px;border-radius:12px}
.edx-tool .i{font-size:20px;line-height:1.1;color:#fff}.edx-tool.on{color:#fff;background:#ffffff14}
.edx-trim{position:relative;height:44px;border-radius:10px;background:var(--p2);margin:4px 10px}
.edx-trim .sel{position:absolute;top:0;bottom:0;background:#29e3ff33;border-top:3px solid var(--cyan);border-bottom:3px solid var(--cyan)}
.edx-trim .h{position:absolute;top:-4px;bottom:-4px;width:22px;margin-left:-11px;border-radius:7px;background:var(--cyan);touch-action:none}
@media (min-width:760px){.ed{grid-template-columns:220px 1fr}.edprev{position:sticky;top:0;align-self:start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= v2 design ================= */
:root{--bg:#07070b;--p1:#111118;--p2:#181822;--p3:#22222e;--line:#ffffff10;--fg:#f4f4f8;--mut:#8e8ea3;
  --pink:#ff4d94;--violet:#8b5cff;--cyan:#2fe0ff;--green:#34e3a0;--amber:#ffb84a;--red:#ff6470;
  --r:22px;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
html,body{background:radial-gradient(1200px 600px at 80% -10%,#2a1640 0%,transparent 60%),radial-gradient(900px 500px at -10% 10%,#0d2b3a 0%,transparent 55%),var(--bg);background-attachment:fixed;font-size:15.5px}
header{background:linear-gradient(#07070bee 60%,#07070b00);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.logo{border-radius:12px;background:conic-gradient(from 200deg,var(--pink),var(--violet),var(--cyan),var(--pink));box-shadow:0 6px 24px #8b5cff55}
header h1{font-size:19px;font-weight:800;letter-spacing:-.4px}
main{padding:6px 16px calc(110px + env(safe-area-inset-bottom))}
.card,.hero2{background:linear-gradient(180deg,#ffffff0a,#ffffff04);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 10px 30px #0006, inset 0 1px 0 #ffffff0d}
.card h2{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:0 0 6px}
.view>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
.view.still>*{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
button,.btn,a.btn{transition:transform .25s var(--spring),background .2s,opacity .2s}
button:active,.btn:active{transform:scale(.95)}
.big{border-radius:16px;min-height:52px;font-weight:800;font-size:16px;letter-spacing:-.1px}
.big.go{background:linear-gradient(135deg,var(--green),#20c5ff);color:#04110b;border:0;box-shadow:0 10px 26px #34e3a040}
.big.stop{background:#ff647022;color:#ff9aa1;border:1px solid #ff647055}
/* hero */
.hero2{position:relative;overflow:hidden}
.hero2.on::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;background:radial-gradient(closest-side,#34e3a033,transparent);filter:blur(6px);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-40px,30px)}}
.hero2 .st{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--mut);font-size:13.5px;text-transform:uppercase;letter-spacing:.06em}
.hero2 .next{display:flex;align-items:baseline;gap:10px;margin:10px 0 12px;flex-wrap:wrap}
.hero2 .next .lbl{color:var(--mut);font-size:14px}
.hero2 .next b{font-size:40px;letter-spacing:-1.2px;line-height:1;background:linear-gradient(90deg,#fff,#c9c3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero2 .next .left{font-size:14px;font-weight:700;color:var(--green)}
.gauge{margin:4px 0 14px}.gauge .bbg{height:6px}.gauge .mut{font-size:12.5px;margin-top:6px}
/* your turn */
.turn{border-color:#ff4d9455;background:linear-gradient(180deg,#ff4d9414,#ffffff04)}
.tit{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.tit:first-of-type{border-top:0}
.tit .th{flex:0 0 66px;height:118px;border-radius:12px;background:#000 center/cover;box-shadow:0 6px 16px #0008}
.tit .tb{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.tit .tb>.pill{align-self:flex-start}
.tit .h{font-weight:700;font-size:14.5px;line-height:1.3}
.tbtn{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.tbtn .btn{padding:8px 11px;font-size:13px}
.more{width:100%;margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--p2);font-weight:700;color:var(--mut)}
.btn.ok{background:#34e3a022;color:#7dffc4;border-color:#34e3a055}
/* who posts */
.who{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.who .wl{font-weight:800}.who .wl.tt{color:#5ff3f0}.who .wl.yt{color:#ff7b7b}
.seg2{display:flex;background:var(--p3);border-radius:12px;padding:3px;gap:3px}
.seg2 button{border:0;background:none;padding:7px 16px;border-radius:9px;font-weight:700;color:var(--mut);font-size:13.5px}
.seg2 button[aria-pressed="true"]{background:#fff;color:#000;box-shadow:0 2px 8px #0006}
/* nav: floating glass pill */
nav{left:50%!important;right:auto!important;transform:translateX(-50%);width:min(420px,calc(100% - 28px));bottom:calc(12px + env(safe-area-inset-bottom))!important;border-radius:24px!important;background:#16161fcc!important;backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid #ffffff14!important;box-shadow:0 16px 40px #000a}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700}
nav .i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"] .i{stroke:#fff}
nav .ind{transition:transform .45s var(--spring),width .45s var(--spring)!important;border-radius:18px!important;background:linear-gradient(135deg,#ff4d9440,#8b5cff40)!important}
/* sheets spring up */
.sheet .in{transition:transform .5s var(--spring)!important;border-radius:26px 26px 0 0!important}
.sheet.open{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* tab change: slide + fade (View Transitions) */
::view-transition-old(root){animation:vt-out .22s var(--ease) both}
::view-transition-new(root){animation:vt-in .38s var(--ease) both}
[data-dir="back"]::view-transition-new(root){animation-name:vt-in-back}
@keyframes vt-out{to{opacity:0;transform:scale(.985)}}
@keyframes vt-in{from{opacity:0;transform:translateX(24px)}}
@keyframes vt-in-back{from{opacity:0;transform:translateX(-24px)}}
.kpi .n{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.gp{display:flex;align-items:center;gap:8px;margin:12px 0 6px}.gpl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.gprow{display:flex;gap:8px;margin:6px 0 8px}.gpin{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line,#ffffff20);background:var(--p2);color:var(--fg);font-size:15px}
.btn.paid{background:linear-gradient(135deg,#ffd76a33,#ff4d9433);border-color:#ffd76a66;color:#ffe39a}
.card.ai{border-color:#8b5cff55;background:linear-gradient(180deg,#8b5cff14,#ffffff04)}
.lessons li{display:block}.lessons .ln{color:var(--mut);font-size:12px}
.test{margin:10px 0}.th2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}.th2 b{font-size:14px}.th2 .mut{font-size:12.5px}
.stack{display:flex;gap:3px;height:26px;border-radius:9px;overflow:hidden}
.stack .seg{display:flex;align-items:center;justify-content:center;min-width:0;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;transition:flex-grow .8s var(--ease,ease)}
.seg.s0{background:#8b5cff;color:#fff}.seg.s1{background:#8b5cff70;color:#fff}.seg.s2{background:#8b5cff45}.seg.s3{background:#8b5cff30}.seg.s4{background:#8b5cff22}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px;font-size:12px;color:var(--mut)}.legend span{display:flex;align-items:center;gap:5px}.legend .dot{width:8px;height:8px;border-radius:3px;display:inline-block}
.dot.s0{background:#8b5cff}.dot.s1{background:#8b5cff70}.dot.s2{background:#8b5cff45}.dot.s3{background:#8b5cff30}.dot.s4{background:#8b5cff22}
.feed{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.feed>div{flex:1}
.feed .fd{flex:0 0 8px;height:8px;border-radius:50%;background:var(--mut)}.feed.new .fd{background:var(--green)}.feed.dropped .fd{background:var(--red)}.feed.shift .fd{background:#8b5cff}
</style>
</head>
<body>
<header>
  <div class="logo">GC</div>
  <div><h1 id="ttl">Clip HQ</h1><div class="sub"><span class="dot" id="dot"></span><span id="livetxt">loading…</span></div></div>
  <div class="icbtn"><button id="reboot" aria-label="Get newest version">↻</button><button id="gear" aria-label="Settings">⚙︎</button></div>
</header>
<main id="main"></main>
<nav id="nav" role="tablist">
  <span class="ind" id="ind"></span>
  <button data-tab="today" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>Today<b id="pcount"></b></button>
  <button data-tab="clips" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></svg>Clips<b id="qcount"></b></button>
  <button data-tab="results" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Results</button>
</nav>
<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const BUILD = '__BUILD__';
const DEV = !/^[0-9a-f]{10}$/.test(BUILD);
const REPO = 'inballin15/Gtaclip-cloud';
const PAGES = 'https://inballin15.github.io/Gtaclip-cloud/';
const SLOTS = [[7, 7], [8, 37], [10, 7], [11, 37], [13, 7], [14, 37], [16, 7], [17, 37], [19, 7], [20, 37], [22, 7]];
const CR = { Clix: 'https://contentrewards.com/discover/7a6a234b-1e9e-4da3-a600-54cc3142e710',
             Lacy: 'https://contentrewards.com/c/campaigns/4479e5e2-9a00-489e-8b0c-345834f37cc7?group=1',
             Kai: 'https://contentrewards.com/', YourRAGE: 'https://contentrewards.com/' };
const TOP = 672;   // webcam strip height on a 1080x1920 video (same as the clip maker)

// ---------------------------------------------------------------- tiny helpers
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* full / private */ } } };
const ghKey = () => ls.get('gc-gh2', '') || (() => { try { return localStorage.getItem('gc-gh') || ''; } catch (e) { return ''; } })();
const fmt = (n) => { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K' : String(n); };
const tET = (iso) => new Date(iso).toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
const dET = (iso) => new Date(iso).toLocaleString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const ago = (iso) => { if (!iso) return '—'; const s = Math.max(0, (Date.now() - new Date(iso)) / 1000); return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = el('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(`${what} copied`);
}
const haptic = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) { /* */ } };

// ---------------------------------------------------------------- state (shown instantly from the last visit, refreshed in the background)
let Q = ls.get('gc-cache-q', { ready: [], posted: [] });
let L = ls.get('gc-cache-l', null);
let openIssues = [];
let pend = ls.get('gc-pending', {});
let submitted = ls.get('gc-submitted', {});
let uploads = ls.get('gc-uploads', []);
let variant = ls.get('gc-variant', 'final');
let tab = 'today';
const TAB_ALIAS = { home: 'today', queue: 'clips', posted: 'results', stats: 'results' };
let RUNS = [], RUNSTEP = {}, runsAt = 0;
const savePend = () => ls.set('gc-pending', pend);
const saveUploads = () => ls.set('gc-uploads', uploads.slice(0, 10));

async function getJSON(url, headers) { const r = await fetch(url, { cache: 'no-store', headers }); if (!r.ok) throw new Error(r.status); return r.json(); }
const authH = () => ({ Authorization: `Bearer ${ghKey()}`, Accept: 'application/vnd.github+json' });
async function gh(method, path, body) {
  const r = await fetch(`https://api.github.com/repos/${REPO}${path}`, { method, headers: { ...authH(), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { const e = new Error(`GitHub ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}
async function ghTap(title, body = '') {
  if (!ghKey()) { openSettings('Connect GitHub once so buttons work with one tap.'); return false; }
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/issues`, { method: 'POST', headers: { ...authH(), 'Content-Type': 'application/json' }, body: JSON.stringify({ title, body }) });
    if (r.status === 401) { openSettings('Your GitHub key expired or is wrong. Make a new one below.'); return false; }
    if (r.status === 403 || r.status === 404) { openSettings('Your GitHub key needs "Issues: Read and write" on Gtaclip-cloud.'); return false; }
    if (!r.ok) { toast(`GitHub error ${r.status} — try again`); return false; }
    haptic(); pend[title] = { at: Date.now(), title }; savePend();
    setTimeout(refreshLive, 5000); setTimeout(refreshLive, 20000);
    return true;
  } catch (e) { toast('No connection — try again'); return false; }
}
async function refreshQueue() {
  try {
    const q = await getJSON(PAGES + 'queue.json?t=' + Date.now());
    if (q.site_build && !DEV && q.site_build !== BUILD && !sessionStorage.getItem('rl-' + q.site_build) && location.pathname.endsWith('/')) {
      sessionStorage.setItem('rl-' + q.site_build, '1'); location.reload(); return;
    }
    Q = q; ls.set('gc-cache-q', { ...q, ready: (q.ready || []).slice(0, 40) });
  } catch (e) { /* keep last */ }
}
async function refreshLive() {
  const key = ghKey();
  try {
    if (key) {
      const [l, iss] = await Promise.all([
        getJSON(`https://api.github.com/repos/${REPO}/contents/live.json?ref=posted&t=${Date.now()}`, { Authorization: `Bearer ${key}`, Accept: 'application/vnd.github.raw+json' }),
        getJSON(`https://api.github.com/repos/${REPO}/issues?state=open&per_page=50&t=${Date.now()}`, authH())]);
      L = l; openIssues = iss.filter((i) => !i.pull_request).map((i) => i.title);
    } else L = await getJSON(`https://raw.githubusercontent.com/${REPO}/posted/live.json?t=${Date.now()}`);
  } catch (e) {
    try { L = await getJSON(`https://raw.githubusercontent.com/${REPO}/posted/live.json?t=${Date.now()}`); } catch (e2) { /* keep last */ }
  }
  if (L) ls.set('gc-cache-l', L);
  for (const [k, p] of Object.entries(pend)) {
    const age = Date.now() - p.at;
    if ((!openIssues.includes(k) && age > 20000 && key) || age > 15 * 60000) delete pend[k];
  }
  savePend(); render();
}
async function refreshRuns() {
  if (Date.now() - runsAt < (ghKey() ? 15000 : 90000)) return; runsAt = Date.now();
  const h = ghKey() ? authH() : { Accept: 'application/vnd.github+json' };
  try {
    RUNS = (await getJSON(`https://api.github.com/repos/${REPO}/actions/runs?per_page=30&t=${Date.now()}`, h)).workflow_runs || [];
    const cur = RUNS.find((r) => r.name.startsWith('gtaclip pipeline') && r.status === 'in_progress');
    if (cur) {
      const jobs = (await getJSON(`https://api.github.com/repos/${REPO}/actions/runs/${cur.id}/jobs?t=${Date.now()}`, h)).jobs || [];
      const st = (jobs[0] && jobs[0].steps) || [];
      const now = st.find((x) => x.status === 'in_progress') || st.filter((x) => x.status === 'completed').pop();
      const N = { pipeline: 'finding clips & making videos', 'publish site + save state': 'publishing to the site', 'load state, posted reports and the current site': 'loading the queue', 'cache raw clips + speech model': 'loading saved clips' };
      RUNSTEP[cur.id] = now ? (N[now.name] || 'starting up') : 'starting up';
    }
  } catch (e) { /* keep last */ }
  if (tab === 'today' || tab === 'results') render();
}

// ---------------------------------------------------------------- derived data
const posts = () => (L && L.posts) || {};
const isPending = (prefix) => Object.keys(pend).some((k) => k.startsWith(prefix)) || openIssues.some((t) => t.startsWith(prefix));
function queueList() {
  const P = posts(); const blocked = new Set((L && L.blocked) || []);
  const now = new Set(((L && L.postnow) || []).map((p) => p.id));
  const list = (Q.ready || []).filter((r) => (r.source === 'upload' || (Date.now() - new Date(r.created || r.found || Date.now())) < 9 * 3600e3)
    && !P[r.id] && !blocked.has(r.id) && !isPending('skip: ' + r.id) && !isPending('manual: ' + r.id));
  const tapped = (r) => now.has(r.id) || isPending('post: ' + r.id);
  const tier = (r) => { const fresh = Date.now() - new Date(r.created || r.found || 0) < 5 * 3600e3; return fresh ? 0 : 1; };
  return list.map((r) => ({ ...r, nowing: tapped(r) })).sort((a, b) => (b.nowing - a.nowing) || ((a.viral_verdict === 'skip') - (b.viral_verdict === 'skip')) || (tier(a) - tier(b)) || ((b.viral ?? 50) - (a.viral ?? 50)));
}
const videos = () => (L && L.videos) || [];
const subKey = (v) => v.link;
// submitted to Content Rewards? — saved by the poster so every device knows (this device's taps count right away)
const isSub = (link) => !!(submitted[link] || (L && L.submitted && L.submitted[link]));
async function markSub(link, clip) {
  submitted[link] = Date.now(); ls.set('gc-submitted', submitted); lastSig = ''; render();
  if (await ghTap(`paid: ${link}${clip ? ' ' + clip : ''}`)) toast('Marked submitted'); }
function toSubmit() { return videos().filter((v) => CR[v.campaign] && !isSub(subKey(v))); }
function slotPlan() {
  const now = new Date(); const day = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const offset = now - day; const act = (L && L.budget && L.budget.active) || SLOTS; return act.map(([h, m]) => { const d = new Date(day); d.setHours(h, m, 0, 0); return new Date(+d + offset); });
}
function sysState() {
  const pipes = RUNS.filter((r) => r.name.startsWith('gtaclip pipeline'));
  return { running: pipes.find((r) => r.status === 'in_progress'), waiting: pipes.filter((r) => ['queued', 'pending', 'waiting'].includes(r.status)).length,
           lastDone: pipes.find((r) => r.status === 'completed' && !['cancelled', 'skipped'].includes(r.conclusion)),
           poster: RUNS.find((r) => r.name.startsWith('gtaclip poster') && r.status === 'completed' && r.conclusion !== 'skipped'),
           clock: RUNS.find((r) => r.name.startsWith('gtaclip clock')),
           upscale: RUNS.find((r) => r.name.startsWith('gtaclip webcam')) };
}
const badge = (st) => { const b = el('span', 'status ' + st.cls); if (st.spin) b.append(el('span', 'spin')); b.append(document.createTextNode(st.txt)); return b; };

// ---------------------------------------------------------------- render (only the open tab; unchanged parts are left alone)
let lastSig = '';
function render() {
  const ql = queueList();
  $('qcount').textContent = ql.filter((r) => r.final).length || '';
  $('pcount').textContent = (toSubmit().length + yourTurn(ql).length) || '';
  const age = L ? (Date.now() - new Date(L.updated)) / 60000 : 99;
  $('dot').className = 'dot' + (!L ? ' bad' : age > 15 ? ' warn' : '');
  $('livetxt').textContent = L ? `updated ${ago(L.updated)}` : 'connecting…';
  const sig = tab + JSON.stringify([Q.topic, (Q.trending || []).length, ql.map((r) => [r.id, r.final, r.clean, r.nowing, r.hook, r.viral]), L && [L.updated, L.paused, L.buffer_off, L.next_slot, (L.videos || []).length],
    Object.keys(pend), openIssues, RUNS.slice(0, 6).map((r) => r.id + r.status), RUNSTEP, variant, submitted, uploads.map((u) => u.state + u.pct + (u.msg || ''))]);
  if (sig === lastSig) return; lastSig = sig;
  const m = $('main'); const scroll = window.scrollY;
  const v = el('div', 'view');
  ({ today: renderToday, clips: renderQueue, results: renderResults })[tab](v, ql);
  [...v.children].forEach((n, i) => n.style.setProperty('--i', Math.min(i, 10)));
  // keep playing videos playing
  const playing = m.querySelector('video:not([paused])');
  if (playing && tab === 'clips' && !playing.paused) return;
  const same = m.dataset.tab === tab;
  m.replaceChildren(v); if (same) { v.classList.add('still'); window.scrollTo(0, scroll); } else countUp(v);
  m.dataset.tab = tab;
}

// ---------------------------------------------------------------- HOME
function topicCard() {
  const t = Q.topic || { name: 'GTA 6' }; const want = Object.keys(pend).concat(openIssues).find((k) => k.startsWith('topic:'));
  const b = el('button', 'topic'); const d = el('div'); d.append(el('div', 'k', 'Clipping now'), el('b', null, want ? `Switching to ${want.slice(6).trim()}…` : t.name));
  d.append(el('div', 'mut', t.game_ids && t.game_ids.length ? 'Twitch category' : t.keywords && t.keywords.length ? 'Live streams about it' : 'Any game your streamers play'));

function b64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); }); }
async function uploadVideo(file, login, streamer, extra = {}) {
  const id = Date.now().toString(36);
  const u = { id, name: file.name.replace(/\.[^.]+$/, '').slice(0, 60), at: Date.now(), state: 'uploading', pct: 0 };
  uploads.unshift(u); saveUploads(); switchTab('queue');
  const CH = 20 * 1024 * 1024; const parts = []; const tree = [];
  try {
    for (let i = 0, off = 0; off < file.size; i++, off += CH) {
      const data = await b64(file.slice(off, off + CH)); let sha = null;
      for (let t = 0; t < 3 && !sha; t++) { try { sha = (await gh('POST', '/git/blobs', { content: data, encoding: 'base64' })).sha; } catch (e) { if (e.status === 403 || e.status === 404) throw e; await new Promise((r) => setTimeout(r, 2000)); } }
      if (!sha) throw new Error('upload kept failing — check your connection');
      const path = `uploads/${id}/part${String(i).padStart(3, '0')}`; parts.push(path); tree.push({ path, mode: '100644', type: 'blob', sha });
      u.pct = Math.min(99, Math.round(((off + CH) / file.size) * 100)); saveUploads(); lastSig = ''; render();
    }
    const t = await gh('POST', '/git/trees', { tree }); const c = await gh('POST', '/git/commits', { message: `upload ${u.name}`, tree: t.sha, parents: [] });
    await gh('POST', '/git/refs', { ref: `refs/heads/upload-${id}`, sha: c.sha });
    const iss = await gh('POST', '/issues', { title: `upload: ${id}`, body: JSON.stringify({ id, ref: `upload-${id}`, parts, name: u.name, login, streamer, size: file.size, ...extra }) });
    Object.assign(u, { state: 'processing', pct: 100, issue: iss.number }); toast(extra.asis ? 'Uploaded — adding it to the queue' : 'Uploaded — finding the best moments');
  } catch (e) { u.state = 'failed'; u.msg = (e.status === 403 || e.status === 404) ? 'Your GitHub key needs Contents → Read and write.' : `Upload failed: ${e.message}`; }
  saveUploads(); lastSig = ''; render();
}
async function clipLink(url, section, login, streamer) {
  const id = Date.now().toString(36); const u = { id, name: url.replace(/^https?:\/\/(www\.)?/, '').slice(0, 40), at: Date.now(), state: 'processing', pct: 100 };
  uploads.unshift(u); saveUploads(); switchTab('queue');
  try { const iss = await gh('POST', '/issues', { title: `upload: ${id}`, body: JSON.stringify({ id, url, section, name: '', login, streamer }) }); u.issue = iss.number; toast('Got it — finding the best moments'); }
  catch (e) { u.state = 'failed'; u.msg = `Couldn't send the link (GitHub ${e.status || e.message})`; }
  saveUploads(); lastSig = ''; render();
}
async function checkUploads() {
  let changed = false;
  for (const u of uploads.filter((x) => x.state === 'processing' && x.issue)) {
    try {
      const iss = await gh('GET', `/issues/${u.issue}`); const cm = await gh('GET', `/issues/${u.issue}/comments?per_page=10`);
      const last = cm.length ? cm[cm.length - 1].body : '';
      if (iss.state === 'closed') { u.state = /^Made \d+ clips?/.test(last) ? 'done' : 'failed'; u.msg = last; changed = true; }
      else if (last && last !== u.msg) { u.msg = last; changed = true; }
    } catch (e) { /* later */ }
  }
  if (changed) { saveUploads(); await refreshQueue(); lastSig = ''; render(); }
}

    const end = parseFloat(m[1].replace(/,/g, '')); const dec = (m[1].split('.')[1] || '').length; const t0 = performance.now();
