<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>GTA Clip · Dashboard</title>
<style>body{margin:0;background:#0b0b12;color:#9a9ab0;font:15px -apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;height:100vh}</style>
</head>
<body>
<div id="msg">Loading the newest version…</div>
<script>
// Launcher: always runs the NEWEST dashboard code, straight from the GitHub repo (no Pages cache / deploy delay).
// Falls back to the copy on this site if GitHub can't be reached.
(async () => {
  const REPO = 'inballin15/Gtaclip-cloud';
  let key = '';
  try { key = JSON.parse(localStorage.getItem('gc-gh2') || '""') || localStorage.getItem('gc-gh') || ''; } catch (e) { /* */ }
  const run = (html) => { document.open(); document.write(html); document.close(); };
  try {
    const h = { Accept: 'application/vnd.github+json' };
    if (key) h.Authorization = `Bearer ${key}`;
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/site/app.html?ref=main&t=${Date.now()}`, { cache: 'no-store', headers: h });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const bytes = Uint8Array.from(atob(j.content.replace(/\n/g, '')), (c) => c.charCodeAt(0));
    const html = new TextDecoder().decode(bytes).replace("'__BUILD__'", `'${j.sha.slice(0, 10)}'`);
    run(html);
  } catch (e) {
    try {
      const r = await fetch('app.html?t=' + Date.now(), { cache: 'no-store' });
      run(await r.text());
    } catch (e2) { document.getElementById('msg').textContent = 'Could not load — check your connection and refresh.'; }
  }
})();
</script>
</body>
</html>
