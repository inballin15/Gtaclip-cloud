<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clip Studio moved</title><!-- v2 -->
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0912;color:#eee;font:16px system-ui,sans-serif;text-align:center;padding:24px}a{color:#ff4fa3}</style>
<script>
// Clip Studio moved to Cloudflare (no 1 GB limit). Forward there and bring the saved settings along
// (browsers keep them per address).
(function () {
  var CF = 'https://gtaclip-studio.pages.dev';
  var data = {};
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('gc-') === 0) data[k] = localStorage.getItem(k); } } catch (e) {}
  var enc = ''; try { enc = btoa(unescape(encodeURIComponent(JSON.stringify(data)))); } catch (e) {}
  var path = location.pathname.replace(/^\/Gtaclip-cloud/i, '');
  if (!path || path === '/' || path === '/index.html') path = '/app.html';
  var h = location.hash || '';
  location.replace(CF + path + location.search + h + (enc && enc.length < 300000 ? (h ? '&' : '#') + 'gcimport=' + enc : ''));
})();
</script></head>
<body><p>Clip Studio moved to <a href="https://gtaclip-studio.pages.dev/app.html">gtaclip-studio.pages.dev</a> &mdash; taking you there&hellip;</p></body></html>
